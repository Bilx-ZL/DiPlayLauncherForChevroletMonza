name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip unzip openssl
          curl -sSL -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          AJ=$(ls -d "$ANDROID_HOME"/platforms/android-*/ | sort -V | tail -1)android.jar
          echo "BT=$BT"
          echo "AJ=$AJ"

          mkdir -p build/classes build/dex dist
          javac -source 8 -target 8 -classpath "$AJ" -d build/classes $(find src -name '*.java')
          "$BT/d8" --min-api 21 --lib "$AJ" --output build/dex $(find build/classes -name '*.class')

          java -jar /tmp/apktool.jar d -f -o work base/K218Launcher.apk
          python3 scripts/patch.py work
          java -jar /tmp/apktool.jar b work -o build/unsigned.apk

          cd build
          cp dex/classes.dex classes2.dex
          zip -q -j unsigned.apk classes2.dex
          "$BT/zipalign" -f -p 4 unsigned.apk aligned.apk
          openssl pkcs8 -inform DER -in ../keys/platform.pk8 -nocrypt -out platform.key
          openssl pkcs12 -export -in ../keys/platform.x509.pem -inkey platform.key \
            -name platform -out platform.p12 -passout pass:android
          "$BT/apksigner" sign --ks platform.p12 --ks-pass pass:android --key-pass pass:android \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled false \
            --out K218Launcher-patched.apk aligned.apk
          "$BT/apksigner" verify --print-certs K218Launcher-patched.apk
          cp K218Launcher-patched.apk ../dist/
          cd ..
          sha256sum dist/K218Launcher-patched.apk | tee dist/SHA256.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: K218Launcher-patched
          path: dist/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build
          name: latest build
          body: |
            自动构建产物（每次推送 main 覆盖更新）
            ${{ github.sha }}
          files: |
            dist/K218Launcher-patched.apk
            dist/SHA256.txt
          overwrite_files: true
          make_latest: true
